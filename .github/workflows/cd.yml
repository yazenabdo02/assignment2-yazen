name: CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / folder name (e.g. v1.0.0)"
        required: true
        type: string
      simulate_failure:
        description: "Demo: make the health check fail to prove automatic rollback"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: ${{ vars.APP_DIR || '/opt/quotes-api' }}
  VERSION: ${{ inputs.version }}

jobs:
  deploy:
    name: Deploy to Linux + nginx
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
    steps:
      - name: Validate version input
        run: |
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid version '$VERSION' (allowed: letters, digits, . _ -)"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare app (production dependencies only)
        run: npm ci --omit=dev

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  BatchMode yes\n  ServerAliveInterval 15\n' \
            "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload to a new release folder (rsync)
        run: |
          RELEASE="$APP_DIR/releases/$VERSION"
          if ssh target "test -e '$RELEASE'"; then
            echo "::error::Release '$VERSION' already exists on the server. Use a new version."; exit 1
          fi
          ssh target "mkdir -p '$RELEASE'"
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'tests' \
            --exclude 'coverage' --exclude 'deploy' --exclude '*.md' \
            ./ "target:$RELEASE/"

      - name: Switch symlink, restart service, reload nginx
        id: switch
        run: |
          RELEASE="$APP_DIR/releases/$VERSION"
          PREV=$(ssh target "readlink -f '$APP_DIR/current' || true")
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${PREV:-<none, first deploy>}"
          ssh target "ln -sfn '$RELEASE' '$APP_DIR/current.tmp' && mv -Tf '$APP_DIR/current.tmp' '$APP_DIR/current'"
          ssh target "sudo systemctl restart quotes-api && sudo /usr/sbin/nginx -s reload"

      - name: Health check through nginx (port 80, with retries)
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          CHECK_PATH=/health
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "::warning::simulate_failure=true -> checking a path that does not exist"
            CHECK_PATH=/health-does-not-exist
          fi
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "http://$SERVER_HOST$CHECK_PATH"; then
              echo; echo "Healthy on attempt $i"; exit 0
            fi
            echo "Attempt $i failed; retrying in 3s..."; sleep 3
          done
          echo "::error::Health check failed after 10 attempts"; exit 1

      - name: Roll back to previous release
        if: failure() && steps.switch.outcome != 'skipped'
        env:
          PREV: ${{ steps.switch.outputs.previous }}
        run: |
          if [ -z "$PREV" ]; then
            echo "::warning::No previous release to roll back to (first deploy)."; exit 0
          fi
          echo "Rolling back to $PREV"
          ssh target "ln -sfn '$PREV' '$APP_DIR/current.tmp' && mv -Tf '$APP_DIR/current.tmp' '$APP_DIR/current'"
          ssh target "sudo systemctl restart quotes-api && sudo /usr/sbin/nginx -s reload"
          sleep 3
          curl -fsS --max-time 5 "http://$SERVER_HOST/health" && echo && echo "Rollback verified healthy"

      - name: Prune old releases (keep last 5)
        run: |
          ssh target "cd '$APP_DIR/releases' && ls -1dt */ | tail -n +6 | xargs -r rm -rf"

  release:
    name: Tag release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes
